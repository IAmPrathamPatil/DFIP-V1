name: DFIP CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    name: Lint and test
    runs-on: ubuntu-latest
    # tests/postgres_support.py refuses to import when CI is set and
    # DFIP_TEST_DATABASE_URL is missing, so this job needs the same
    # PostgreSQL 16 service the Phase 1 job already uses. The pytest run is
    # unfiltered, so it exercises the database tests here as well.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dfip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dfip_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check packages tests

      - name: Format
        if: always()
        run: python -m ruff format --check packages tests

      - name: Test
        if: always()
        env:
          DFIP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dfip_test
        run: python -m pytest --junitxml=pytest-report.xml

  postgres-phase1:
    name: PostgreSQL Phase 1
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dfip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dfip_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: PostgreSQL Phase 1 tests
        env:
          DFIP_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dfip_test
        run: python -m pytest -m postgres --tb=short --junitxml=pytest-report.xml
